; LaserPlan – firmware pro ESP32-C3 (Bluetooth LE laserový metr)
;
; Překlad a nahrání:   pio run -t upload
; Sériová konzole:     pio device monitor
;
; Deska LaserPlan používá modul ESP32-C3-WROOM-02 (4 MB flash) a nativní USB
; (USB-Serial/JTAG), takže není potřeba žádný převodník USB-UART.

[platformio]
default_envs = laserplan

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    olikraus/U8g2@2.35.30
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Vlastní deska LaserPlan (výchozí)
[env:laserplan]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DLP_BOARD_LASERPLAN=1

; Vývojová deska ESP32-C3 SuperMini / DevKitM-1 s modulem na nepájivém poli
; (piny viz include/config.h – sekce LP_BOARD_DEVKIT)
[env:devkit]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DLP_BOARD_DEVKIT=1
