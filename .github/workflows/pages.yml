# Sestaví firmware, otestuje aplikaci a nasadí ji na GitHub Pages.
# Jednorázově zapni: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Aplikace + firmware na GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy aplikace
        run: node --test app/tests/*.test.mjs
      - name: PlatformIO cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Překlad firmwaru
        run: |
          pip install platformio
          firmware/scripts/web_flash_bundle.sh "$GITHUB_WORKSPACE/app/firmware"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
